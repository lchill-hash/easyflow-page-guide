<!doctype html>
<html lang="en">
  <body>
    <!-- Calendar-semantics fixture, not a captured Cal.com DOM. -->
    <section aria-label="Booking calendar">
      <div data-testid="booking-calendar" role="grid" aria-label="November 2026">
        <button data-testid="day" aria-label="Monday, November 16, 2026">16</button>
        <button data-testid="day" aria-label="Tuesday, November 17, 2026" disabled>17</button>
        <button data-testid="day" aria-label="Wednesday, November 18, 2026">18</button>
      </div>
    </section>
  </body>
</html>
