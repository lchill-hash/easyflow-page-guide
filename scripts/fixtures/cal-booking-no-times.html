<!doctype html>
<html lang="en">
  <body>
    <!-- Calendar-semantics fixture, not a captured Cal.com DOM. -->
    <div data-testid="booking-calendar" role="grid" aria-label="November 2026">
      <button data-testid="day" aria-label="Monday, November 16, 2026" aria-selected="true">16</button>
    </div>
    <div data-testid="time-slots" role="listbox" aria-label="Available times">
      <button data-testid="time" aria-label="9:00 AM" disabled>9:00 AM</button>
      <button data-testid="time" aria-label="10:00 AM" disabled>10:00 AM</button>
    </div>
  </body>
</html>
