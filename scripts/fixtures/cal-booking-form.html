<!doctype html>
<html lang="en">
  <body>
    <!-- Calendar-semantics fixture, not a captured Cal.com DOM. No input values. -->
    <div data-testid="booking-calendar" role="grid" aria-label="November 2026">
      <button data-testid="day" aria-label="Monday, November 16, 2026" aria-selected="true">16</button>
    </div>
    <div data-testid="time-slots" role="listbox" aria-label="Available times">
      <button data-testid="time" aria-label="10:00 AM" aria-pressed="true">10:00 AM</button>
    </div>
    <form data-testid="booking-form">
      <label for="name">Name</label>
      <input id="name" name="name" autocomplete="name" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" />
      <button type="submit">Book</button>
    </form>
  </body>
</html>
